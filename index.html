<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1d0b09"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Temple Snakes and Ladders</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=DM+Sans:wght@400;600&display=swap">
<style>
/* Layout: one phone-width column. Header, player chips, the board with coin tokens, then the dice dock. Single dark temple look by design. */
:root {
  --bg: #1d0b09;
  --panel: #2c1511;
  --line: #5c3622;
  --gold: #f2c14e;
  --gold-ink: #2a1500;
  --text: #fbeed4;
  --muted: #cfae8f;
  --font-display: "Cinzel", Georgia, "Times New Roman", serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-block: 14px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; letter-spacing: 0.05em; color: var(--gold); }
button { font: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
.primary { background: var(--gold); color: var(--gold-ink); border: 0; border-radius: 12px; min-height: 48px; padding: 0 22px; font-weight: 600; }
.primary:disabled { opacity: 0.45; cursor: default; }
.ghost { background: transparent; color: var(--text); border: 1.5px solid var(--line); border-radius: 12px; min-height: 40px; padding: 0 14px; font-weight: 600; }

.hud { display: grid; gap: 8px; }
.chip { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; min-width: 0; transition: border-color 0.2s, background 0.2s; }
.chip img { width: 34px; height: 34px; display: block; }
.chip b { font-size: 0.78rem; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .sq { font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.on { border-color: var(--gold); background: #3b1d15; box-shadow: 0 0 0 2px rgba(242, 193, 78, 0.25); }

.board { position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden; background: var(--panel); box-shadow: 0 6px 22px rgba(0, 0, 0, 0.55); }
.board .bg { width: 100%; height: 100%; display: block; -webkit-user-drag: none; }
#tokens { position: absolute; inset: 0; pointer-events: none; }
.tok { position: absolute; transform: translate(-50%, -50%); z-index: 2; transition: left 0.24s ease, top 0.24s ease, width 0.2s ease; }
.tok.slide { transition: left 1s cubic-bezier(0.45, 0.05, 0.3, 1), top 1s cubic-bezier(0.45, 0.05, 0.3, 1), width 0.2s ease; }
.tok img { width: 100%; height: auto; display: block; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.6)); }
.tok.active { z-index: 3; }
.tok.active img { filter: drop-shadow(0 0 7px #ffe08a) drop-shadow(0 2px 3px rgba(0, 0, 0, 0.6)); }
.tok img.hop { animation: hop 0.24s ease; }
@keyframes hop { 0%, 100% { transform: translateY(0) scale(1); } 45% { transform: translateY(-30%) scale(1.1); } }

.dock { display: flex; align-items: center; gap: 14px; }
.die { flex: none; width: 68px; height: 68px; padding: 9px; border-radius: 15px; border: 2px solid var(--gold); background: #fbf3df; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 2px; }
.die:disabled { cursor: default; }
.die .pip { border-radius: 50%; }
.die .pip.on { background: #b3261e; }
.die.rolling { animation: shake 0.14s linear infinite; }
@keyframes shake { 0% { transform: rotate(-7deg); } 50% { transform: rotate(7deg) translateY(-2px); } 100% { transform: rotate(-7deg); } }
.say { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
#msg { min-height: 2.8em; font-weight: 600; }

.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(12, 5, 4, 0.82); display: flex; align-items: center; justify-content: center; padding: 16px; padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
.card { width: 100%; max-width: 380px; background: var(--panel); border: 2px solid var(--gold); border-radius: 18px; padding: 22px 20px; display: flex; flex-direction: column; gap: 16px; }
.card h2 { margin: 0; font-family: var(--font-display); font-size: 1.4rem; color: var(--gold); text-align: center; letter-spacing: 0.04em; }
.card p { margin: 0; color: var(--muted); font-size: 0.92rem; }
.card.center { align-items: center; text-align: center; }
.field { display: flex; flex-direction: column; gap: 8px; }
.lab { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; gap: 8px; }
.seg button { flex: 1; min-height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: transparent; color: var(--text); font-weight: 600; padding: 0 8px; }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.wincoin { width: 104px; height: 104px; }
.row2 { display: flex; gap: 10px; width: 100%; }
.row2 > * { flex: 1; }
@media (prefers-reduced-motion: reduce) {
  .tok, .tok.slide { transition-duration: 0.01s; }
  .tok img.hop, .die.rolling { animation: none; }
}
</style>

  var ROW_Y = [1066, 989, 903, 816, 730, 644, 559, 470, 379, 277];
  var SIZE = 1254;
  var OFF = [[-1, -1], [1, -1], [-1, 1], [1, 1]];
  var FACES = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };

  var $ = function (id) { return document.getElementById(id); };
  var hud = $('hud'), tokensEl = $('tokens'), die = $('die'), rollBtn = $('rollBtn'), msgEl = $('msg');
  var setup = $('setup'), winSheet = $('winSheet');

  var players = [], turn = 0, busy = false, over = false, G = 0;
  var cfg = { n: 2, mode: 'cpu' };
  try {
    var saved = JSON.parse(localStorage.getItem('temple-snl') || 'null');
    if (saved && saved.n >= 2 && saved.n <= 4 && (saved.mode === 'cpu' || saved.mode === 'friends')) cfg = saved;
  } catch (e) {}

  var pips = [];
  for (var i = 0; i < 9; i++) { var s = document.createElement('span'); s.className = 'pip'; die.appendChild(s); pips.push(s); }
  function showFace(v) { pips.forEach(function (p, k) { p.classList.toggle('on', FACES[v].indexOf(k) !== -1); }); }

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function say(t) { msgEl.textContent = t; }

  function cell(n) {
    var i = n - 1, r = Math.floor(i / 10), c = i % 10;
    var col = r % 2 === 0 ? c : 9 - c;
    return { x: 180 + 100.8 * col, y: ROW_Y[r] };
  }

  function layout() {
    var groups = {};
    players.forEach(function (p, i) { if (p.pos > 0) (groups[p.pos] = groups[p.pos] || []).push(i); });
    players.forEach(function (p, i) {
      var x, y, w;
      if (p.pos === 0) { x = 150 + i * 80; y = 1142; w = 6.6; }
      else {
        var c = cell(p.pos), g = groups[p.pos], k = g.indexOf(i);
        x = c.x; y = c.y; w = 7.4;
        if (g.length > 1) { x += OFF[k][0] * 24; y += OFF[k][1] * 24; w = 5.4; }
      }
      p.el.style.left = (x / SIZE * 100) + '%';
      p.el.style.top = (y / SIZE * 100) + '%';
      p.el.style.width = w + '%';
      p.el.classList.toggle('active', i === turn && !over);
    });
  }

  function hop(p) {
    var img = p.el.firstChild;
    img.classList.remove('hop'); void img.offsetWidth; img.classList.add('hop');
  }

  function buildHud() {
    hud.innerHTML = '';
    hud.style.gridTemplateColumns = 'repeat(' + players.length + ', minmax(0, 1fr))';
    players.forEach(function (p, i) {
      var d = document.createElement('div');
      d.className = 'chip';
      d.innerHTML = '<img alt="" src="' + COINS[i] + '"><b></b><span class="sq"></span>';
      d.querySelector('b').textContent = p.name;
      hud.appendChild(d);
      p.chip = d; p.sq = d.querySelector('.sq');
    });
  }

  function updateHud() {
    players.forEach(function (p, i) {
      p.chip.classList.toggle('on', i === turn && !over);
      p.sq.textContent = p.pos === 0 ? 'Start' : 'Square ' + p.pos;
    });
    players.forEach(function (p, i) { p.el.classList.toggle('active', i === turn && !over); });
  }

  function setRoll() {
    var human = players[turn] && !players[turn].cpu;
    var can = human && !busy && !over;
    die.disabled = !can; rollBtn.disabled = !can;
    rollBtn.textContent = over ? 'Game over' : (human ? 'Roll dice' : 'Computer playing');
  }

  function rollDice() {
    return new Promise(function (resolve) {
      die.classList.add('rolling');
      var n = 0;
      var iv = setInterval(function () {
        showFace(1 + Math.floor(Math.random() * 6));
        if (++n >= 9) {
          clearInterval(iv);
          var v = 1 + Math.floor(Math.random() * 6);
          showFace(v); die.classList.remove('rolling');
          resolve(v);
        }
      }, 70);
    });
  }

  function promptTurn(g) {
    updateHud(); setRoll();
    var p = players[turn];
    if (p.cpu) { setTimeout(function () { if (g === G) takeTurn(); }, 900); }
  }

  async function takeTurn() {
    if (busy || over) return;
    var g = G; busy = true; setRoll();
    var p = players[turn];
    var v = await rollDice(); if (g !== G) return;
    say(p.name + ' rolled ' + v);

    var target = p.pos + v;
    if (target > 100) {
      say(p.name + ' needs exactly ' + (100 - p.pos) + ' to reach 100');
      await wait(1100); if (g !== G) return;
    } else {
      for (var s = p.pos + 1; s <= target; s++) {
        p.pos = s; layout(); hop(p); updateHud();
        await wait(240); if (g !== G) return;
      }
      var dest = LADDERS[p.pos] || SNAKES[p.pos];
      if (dest) {
        var up = !!LADDERS[p.pos];
        say((up ? 'Ladder! ' : 'Snake! ') + p.name + (up ? ' climbs to ' : ' slides to ') + dest);
        await wait(500); if (g !== G) return;
        p.el.classList.add('slide'); p.pos = dest; layout(); updateHud();
        await wait(1050); if (g !== G) return;
        p.el.classList.remove('slide');

    var again = (v === 6);
    if (again) { say(p.name + ' rolled a 6. Roll again!'); }
    else { turn = (turn + 1) % players.length; say(players[turn].name + ', your turn'); }
    busy = false;
    promptTurn(g);
  }

  function finish(p) {
    over = true; busy = false;
    updateHud(); layout(); setRoll();
    say(p.name + ' wins!');
    var g = G;
    setTimeout(function () {
      if (g !== G) return;
      $('winCoin').src = COINS[players.indexOf(p)];
      $('winTitle').textContent = p.name + ' wins!';
      winSheet.hidden = false;
      $('againBtn').focus();
    }, 900);
  }

  function newGame(n, mode) {

    tokensEl.innerHTML = '';
    for (var i = 0; i < n; i++) {
      var cpu = mode === 'cpu' && i > 0;
      var p = { pos: 0, cpu: cpu, name: cpu ? 'CPU' + (n > 2 ? ' ' + (i + 1) : '') : 'Player ' + (i + 1) };
      p.el = document.createElement('div');
      p.el.className = 'tok';
      p.el.innerHTML = '<img alt="" src="' + COINS[i] + '">';
      tokensEl.appendChild(p.el);
      players.push(p);
    }
    buildHud(); layout(); showFace(1);
    say(players[0].name + ', roll the dice');

  $('segN').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { cfg.n = +b.dataset.v; syncSeg(); } });
  $('segM').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { cfg.mode = b.dataset.v; syncSeg(); } });
  $('startBtn').addEventListener('click', function () { setup.hidden = true; newGame(cfg.n, cfg.mode); });
  $('cancelBtn').addEventListener('click', function () { setup.hidden = true; });
  $('newBtn').addEventListener('click', openSetup);
  $('changeBtn').addEventListener('click', openSetup);
  $('againBtn').addEventListener('click', function () { winSheet.hidden = true; newGame(cfg.n, cfg.mode); });
  die.addEventListener('click', takeTurn);
  rollBtn.addEventListener('click', takeTurn);
  document.addEventListener('keydown', function (e) {
    if ((e.key === ' ' || e.key === 'Enter') && setup.hidden && winSheet.hidden && document.activeElement === document.body) { e.preventDefault(); if (!die.disabled) takeTurn(); }
  });

  newGame(cfg.n, cfg.mode);
})();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
